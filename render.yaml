# Render Blueprint — omini AI Telegram boti (24/7 long polling + keep-alive).
# Render'da "New +" → "Blueprint" bilan shu repozitoriyani tanlasangiz, servis
# avtomatik yaratiladi. BOT_TOKEN, GEMINI_API_KEY va DEVICE_SECRET sync: false —
# ular faqat Render dashboard'dagi Environment Keys'ga kiritiladi (repositoriyada
# saqlanmaydi). DEVICE_SECRET bo'sh qolsa bot ishlaydi, lekin har restart'da
# qurilmalar (companion agentlari) qayta /pair yozishi kerak bo'ladi.
#
# Xotira (SQLite) DB_PATH = bot_data.db — servis papkasida (yozish mumkin bo'lgan
# joy). DIQQAT: Free rejada Persistent Disk yo'q, shuning uchun deploy, restart va
# 15 daqiqalik bo'shlikdan (spin-down) keyin baza qaytadan bo'sh ochiladi: suhbat
# tarixi, kontaktlar va ban/ogohlantirish zarbalari yo'qoladi. Doimiy xotira kerak
# bo'lsa — dashboard'da payment method qo'shib, instance'ni starter rejaga
# ko'tarib, plan: starter + disks: /var/data va DB_PATH: /var/data/bot_data.db qiling.

services:
  - type: web
    name: omini-ai-bot
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.4
      - key: BOT_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: DEVICE_SECRET
        sync: false
      - key: ADMIN_ID
        value: "8692018182"
      - key: MODEL_NAME
        value: gemini-3.5-flash-lite
      - key: MODEL_LIST
        value: gemini-3.5-flash-lite
      - key: DAILY_LIMIT
        value: "150"
      - key: RATE_LIMIT_COUNT
        value: "6"
      - key: RATE_LIMIT_WINDOW
        value: "30"
      - key: PROFANITY_MODE
        value: block
      - key: PROFANITY_BLOCK_AFTER
        value: "2"
      - key: PROFANITY_BAN_HOURS
        value: "0"
      - key: TTS_LANGS
        value: uz,tr
      - key: IMAGE_PROVIDER
        value: auto
      - key: IMAGE_MODEL
        value: gemini-3.1-flash-image
      - key: IMAGE_MODEL_FALLBACK
        value: gemini-2.5-flash-image
      - key: LOG_FILE
        value: ""
      - key: DB_PATH
        value: bot_data.db
