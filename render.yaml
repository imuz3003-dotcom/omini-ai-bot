# Render Blueprint — omini AI Telegram boti (24/7 long polling + keep-alive).
# Render'da "New +" → "Blueprint" bilan shu repozitoriyani tanlasangiz, servis
# avtomatik yaratiladi. BOT_TOKEN va GEMINI_API_KEY sync: false — ular faqat
# Render dashboard'dagi Environment Keys'ga kiritiladi (repositoriyada saqlanmaydi).
#
# Xotira (SQLite) doimiy bo'lishi uchun bu servis "starter" ($7/oy) rejada va
# Persistent Disk'ga yozadi: DB_PATH = /var/data/bot_data.db. Shu disk deploy va
# restart'lardan keyin saqlanadi, ya'ni xotira, kontaktlar va ban/ogohlantirish
# zarbalari qayta chiqmaydi. Bepul (free) rejaga qaytsangiz disk yo'qoladi va
# baza yozuvlari o'chadi.
#
# DIQQAT: plan: starter yozuvi Render'da to'lov usuli (payment method) soraydi —
# dashboard'da billing kiritilmagan bo'lsa, servis yangilanishi rad etiladi.
# Birinchi deploy'dan keyin eski /opt/render/project/src/bot_data.db faylini
# /var/data/'ga ko'chirish uchun Shell'da: cp -n bot_data.db /var/data/

services:
  - type: web
    name: omini-ai-bot
    runtime: python
    plan: starter
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /health
    autoDeploy: true
    disks:
      - name: omini-data
        mountPath: /var/data
        size: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.4
      - key: BOT_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ADMIN_ID
        value: "8692018182"
      - key: MODEL_NAME
        value: gemini-3.5-flash-lite
      - key: MODEL_LIST
        value: gemini-3.5-flash-lite
      - key: DAILY_LIMIT
        value: "150"
      - key: RATE_LIMIT_COUNT
        value: "6"
      - key: RATE_LIMIT_WINDOW
        value: "30"
      - key: PROFANITY_MODE
        value: block
      - key: PROFANITY_BLOCK_AFTER
        value: "2"
      - key: PROFANITY_BAN_HOURS
        value: "24"
      - key: TTS_LANGS
        value: uz,tr
      - key: IMAGE_PROVIDER
        value: auto
      - key: IMAGE_MODEL
        value: gemini-3.1-flash-image
      - key: IMAGE_MODEL_FALLBACK
        value: gemini-2.5-flash-image
      - key: LOG_FILE
        value: ""
      - key: DB_PATH
        value: /var/data/bot_data.db
